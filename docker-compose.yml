services:
  postgres:
    image: postgres:16-alpine
    container_name: smart-transit-postgres
    environment:
      POSTGRES_DB: smart_transit
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smart_transit"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
