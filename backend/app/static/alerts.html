<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Transit Security - Alerts Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 600;
        }

        .header-stats {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .stat-value {
            font-size: 24px;
            font-weight: bold;
        }

        .stat-label {
            font-size: 12px;
            opacity: 0.9;
            margin-top: 5px;
        }

        .controls {
            padding: 20px 30px;
            background: #f8f9fa;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
            border-bottom: 1px solid #e0e0e0;
        }

        .control-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        label {
            font-weight: 500;
            color: #333;
            font-size: 14px;
        }

        select, input {
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            background: white;
            cursor: pointer;
        }

        select:focus, input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        button {
            padding: 8px 16px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 500;
            font-size: 14px;
            transition: background 0.3s;
        }

        button:hover {
            background: #5568d3;
        }

        button.secondary {
            background: #6c757d;
        }

        button.secondary:hover {
            background: #5a6268;
        }

        .refresh-indicator {
            font-size: 12px;
            color: #666;
            margin-left: auto;
        }

        .refresh-indicator.loading {
            color: #667eea;
            font-weight: 500;
        }

        .table-wrapper {
            overflow-x: auto;
            padding: 20px 30px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #f8f9fa;
            padding: 15px;
            text-align: left;
            font-weight: 600;
            color: #333;
            border-bottom: 2px solid #e0e0e0;
            cursor: pointer;
            user-select: none;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        th:hover {
            background: #eff0f5;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #e0e0e0;
            font-size: 14px;
        }

        tr:hover {
            background: #f8f9fa;
        }

        .severity-critical {
            background: #ffebee;
            color: #c62828;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: 600;
            font-size: 12px;
        }

        .severity-high {
            background: #fff3e0;
            color: #e65100;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: 600;
            font-size: 12px;
        }

        .severity-medium {
            background: #f3e5f5;
            color: #6a1b9a;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: 600;
            font-size: 12px;
        }

        .severity-low {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: 600;
            font-size: 12px;
        }

        .no-data {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .error-message {
            background: #ffebee;
            color: #c62828;
            padding: 15px 30px;
            margin: 20px 30px 0 30px;
            border-radius: 5px;
            border-left: 4px solid #c62828;
        }

        .success-message {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 15px 30px;
            margin: 20px 30px 0 30px;
            border-radius: 5px;
            border-left: 4px solid #2e7d32;
        }

        .timestamp {
            color: #666;
            font-size: 13px;
            white-space: nowrap;
        }

        .alert-type {
            font-weight: 500;
            color: #333;
        }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 20px;
            border-top: 1px solid #e0e0e0;
            background: #f8f9fa;
        }

        .pagination button {
            padding: 8px 12px;
            min-width: 40px;
        }

        .pagination button.active {
            background: #667eea;
            color: white;
        }

        .pagination button:disabled {
            background: #e0e0e0;
            cursor: not-allowed;
            color: #999;
        }

        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                text-align: center;
            }

            .header-stats {
                width: 100%;
                justify-content: center;
            }

            .controls {
                flex-direction: column;
                align-items: stretch;
            }

            .control-group {
                flex-direction: column;
            }

            .refresh-indicator {
                margin-left: 0;
                text-align: center;
            }

            table {
                font-size: 12px;
            }

            td, th {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚨 Alerts Dashboard</h1>
            <div class="header-stats">
                <div class="stat-item">
                    <div class="stat-value" id="totalAlerts">0</div>
                    <div class="stat-label">Total Alerts</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="criticalCount">0</div>
                    <div class="stat-label">Critical</div>
                </div>
            </div>
        </div>

        <div class="controls">
            <div class="control-group">
                <label for="severityFilter">Severity:</label>
                <select id="severityFilter">
                    <option value="">All Levels</option>
                    <option value="CRITICAL">Critical</option>
                    <option value="HIGH">High</option>
                    <option value="MEDIUM">Medium</option>
                    <option value="LOW">Low</option>
                </select>
            </div>

            <div class="control-group">
                <label for="alertTypeFilter">Alert Type:</label>
                <select id="alertTypeFilter">
                    <option value="">All Types</option>
                </select>
            </div>

            <div class="control-group">
                <label for="autoRefresh">Auto-refresh:</label>
                <select id="autoRefresh">
                    <option value="0">Off</option>
                    <option value="5">Every 5s</option>
                    <option value="10" selected>Every 10s</option>
                    <option value="30">Every 30s</option>
                    <option value="60">Every 60s</option>
                </select>
            </div>

            <button onclick="loadAlerts()">Refresh Now</button>
            <button class="secondary" onclick="downloadCSV()">Download CSV</button>

            <div class="refresh-indicator" id="refreshIndicator">Last updated: never</div>
        </div>

        <div id="messages"></div>

        <div class="table-wrapper">
            <table id="alertsTable">
                <thead>
                    <tr>
                        <th onclick="sortTable('alert_id')">Alert ID ↕</th>
                        <th onclick="sortTable('alert_type')">Type ↕</th>
                        <th onclick="sortTable('severity')">Severity ↕</th>
                        <th onclick="sortTable('created_at')">Timestamp ↕</th>
                        <th onclick="sortTable('details')">Details ↕</th>
                        <th onclick="sortTable('acknowledged')">Status ↕</th>
                    </tr>
                </thead>
                <tbody id="alertsBody">
                    <tr class="no-data"><td colspan="6">Loading alerts...</td></tr>
                </tbody>
            </table>
        </div>

        <div class="pagination" id="pagination"></div>
    </div>

    <script>
        let allAlerts = [];
        let filteredAlerts = [];
        let currentPage = 1;
        const itemsPerPage = 20;
        let sortColumn = 'created_at';
        let sortDirection = 'DESC';
        let autoRefreshInterval = null;
        let ws = null;

        const API_URL = 'http://localhost:8001/alerts';
        const WS_URL = 'ws://localhost:8002/ws/analytics';

        async function loadAlerts() {
            try {
                updateRefreshIndicator('loading');
                const response = await fetch(API_URL);
                
                if (!response.ok) {
                    throw new Error(`API Error: ${response.status}`);
                }

                const data = await response.json();
                allAlerts = Array.isArray(data) ? data : (data.alerts || []);
                
                populateAlertTypeFilter();
                applyFilters();
                updateRefreshIndicator('success');
                showMessage(`Loaded ${allAlerts.length} alerts`, 'success');
            } catch (error) {
                console.error('Error loading alerts:', error);
                showMessage(`Error loading alerts: ${error.message}`, 'error');
                updateRefreshIndicator('error');
            }
        }

        function connectWebSocket() {
            try {
                ws = new WebSocket(WS_URL);
                
                ws.onopen = () => {
                    console.log('WebSocket connected');
                    showMessage('Connected to live alert stream', 'success');
                };

                ws.onmessage = (event) => {
                    try {
                        const alert = JSON.parse(event.data);
                        console.log('New alert received:', alert);
                        
                        // Add new alert to the beginning of the list
                        allAlerts.unshift(alert);
                        
                        // Re-apply filters and display
                        applyFilters();
                        updateStats();
                        
                        showMessage(`New alert: ${alert.alert_type}`, 'success');
                    } catch (e) {
                        console.error('Error parsing WebSocket message:', e);
                    }
                };

                ws.onerror = (error) => {
                    console.error('WebSocket error:', error);
                    showMessage('WebSocket connection failed - using polling only', 'error');
                };

                ws.onclose = () => {
                    console.log('WebSocket disconnected');
                    // Try to reconnect after 5 seconds
                    setTimeout(connectWebSocket, 5000);
                };
            } catch (error) {
                console.error('Error connecting WebSocket:', error);
                // Continue with polling if WebSocket fails
            }
        }

        function populateAlertTypeFilter() {
            const types = [...new Set(allAlerts.map(a => a.alert_type).filter(Boolean))];
            const select = document.getElementById('alertTypeFilter');
            const current = select.value;
            select.innerHTML = '<option value="">All Types</option>';
            types.forEach(type => {
                const option = document.createElement('option');
                option.value = type;
                option.textContent = type;
                select.appendChild(option);
            });
            select.value = current;
        }

        function applyFilters() {
            const severityFilter = document.getElementById('severityFilter').value;
            const typeFilter = document.getElementById('alertTypeFilter').value;

            filteredAlerts = allAlerts.filter(alert => {
                if (severityFilter && alert.severity !== severityFilter) return false;
                if (typeFilter && alert.alert_type !== typeFilter) return false;
                return true;
            });

            sortAlerts();
            currentPage = 1;
            displayAlerts();
            updateStats();
        }

        function sortAlerts() {
            filteredAlerts.sort((a, b) => {
                let aVal = a[sortColumn];
                let bVal = b[sortColumn];

                if (typeof aVal === 'string') {
                    aVal = aVal.toLowerCase();
                    bVal = bVal.toLowerCase();
                }

                if (sortDirection === 'ASC') {
                    return aVal > bVal ? 1 : -1;
                } else {
                    return aVal < bVal ? 1 : -1;
                }
            });
        }

        function sortTable(column) {
            if (sortColumn === column) {
                sortDirection = sortDirection === 'ASC' ? 'DESC' : 'ASC';
            } else {
                sortColumn = column;
                sortDirection = 'DESC';
            }
            applyFilters();
        }

        function displayAlerts() {
            const tbody = document.getElementById('alertsBody');
            const start = (currentPage - 1) * itemsPerPage;
            const end = start + itemsPerPage;
            const pageAlerts = filteredAlerts.slice(start, end);

            if (pageAlerts.length === 0) {
                tbody.innerHTML = '<tr class="no-data"><td colspan="6">No alerts found</td></tr>';
                document.getElementById('pagination').innerHTML = '';
                return;
            }

            tbody.innerHTML = pageAlerts.map(alert => `
                <tr>
                    <td><code style="background: #f0f0f0; padding: 2px 6px; border-radius: 3px; font-size: 12px;">${escapeHtml(alert.alert_id || 'N/A')}</code></td>
                    <td><span class="alert-type">${escapeHtml(alert.alert_type || 'Unknown')}</span></td>
                    <td><span class="severity-${(alert.severity || 'LOW').toLowerCase()}">${alert.severity || 'LOW'}</span></td>
                    <td><span class="timestamp">${formatTimestamp(alert.created_at)}</span></td>
                    <td style="max-width: 300px; overflow: hidden; text-overflow: ellipsis;">${escapeHtml(alert.details || 'N/A')}</td>
                    <td>${alert.acknowledged ? '✓ Acknowledged' : '⏳ Pending'}</td>
                </tr>
            `).join('');

            updatePagination();
        }

        function updatePagination() {
            const totalPages = Math.ceil(filteredAlerts.length / itemsPerPage);
            const pagination = document.getElementById('pagination');

            if (totalPages <= 1) {
                pagination.innerHTML = '';
                return;
            }

            let html = '';
            if (currentPage > 1) {
                html += `<button onclick="goToPage(${currentPage - 1})">← Previous</button>`;
            }

            const maxButtons = 5;
            let startPage = Math.max(1, currentPage - Math.floor(maxButtons / 2));
            let endPage = Math.min(totalPages, startPage + maxButtons - 1);
            if (endPage - startPage < maxButtons - 1) {
                startPage = Math.max(1, endPage - maxButtons + 1);
            }

            if (startPage > 1) {
                html += `<button onclick="goToPage(1)">1</button>`;
                if (startPage > 2) html += '<span>...</span>';
            }

            for (let i = startPage; i <= endPage; i++) {
                const active = i === currentPage ? 'active' : '';
                html += `<button class="${active}" onclick="goToPage(${i})">${i}</button>`;
            }

            if (endPage < totalPages) {
                if (endPage < totalPages - 1) html += '<span>...</span>';
                html += `<button onclick="goToPage(${totalPages})">${totalPages}</button>`;
            }

            if (currentPage < totalPages) {
                html += `<button onclick="goToPage(${currentPage + 1})">Next →</button>`;
            }

            pagination.innerHTML = html;
        }

        function goToPage(page) {
            currentPage = page;
            displayAlerts();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function updateStats() {
            document.getElementById('totalAlerts').textContent = allAlerts.length;
            const critical = allAlerts.filter(a => a.severity === 'CRITICAL').length;
            document.getElementById('criticalCount').textContent = critical;
        }

        function formatTimestamp(timestamp) {
            if (!timestamp) return 'N/A';
            const date = new Date(timestamp);
            return date.toLocaleString();
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function updateRefreshIndicator(status) {
            const indicator = document.getElementById('refreshIndicator');
            if (status === 'loading') {
                indicator.textContent = 'Loading...';
                indicator.classList.add('loading');
            } else if (status === 'success') {
                const now = new Date().toLocaleTimeString();
                indicator.textContent = `Last updated: ${now}`;
                indicator.classList.remove('loading');
            } else if (status === 'error') {
                indicator.textContent = 'Error loading alerts';
                indicator.classList.add('loading');
            }
        }

        function showMessage(message, type) {
            const messagesDiv = document.getElementById('messages');
            const className = type === 'error' ? 'error-message' : 'success-message';
            messagesDiv.innerHTML = `<div class="${className}">${escapeHtml(message)}</div>`;
            setTimeout(() => {
                messagesDiv.innerHTML = '';
            }, 5000);
        }

        function downloadCSV() {
            if (filteredAlerts.length === 0) {
                showMessage('No alerts to download', 'error');
                return;
            }

            const headers = ['Alert ID', 'Type', 'Severity', 'Timestamp', 'Details', 'Acknowledged'];
            const rows = filteredAlerts.map(alert => [
                alert.alert_id || '',
                alert.alert_type || '',
                alert.severity || '',
                alert.created_at || '',
                alert.details || '',
                alert.acknowledged ? 'Yes' : 'No'
            ]);

            const csv = [headers, ...rows].map(row => 
                row.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(',')
            ).join('\n');

            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `alerts-${new Date().toISOString().split('T')[0]}.csv`;
            a.click();
            window.URL.revokeObjectURL(url);
        }

        document.getElementById('severityFilter').addEventListener('change', applyFilters);
        document.getElementById('alertTypeFilter').addEventListener('change', applyFilters);

        document.getElementById('autoRefresh').addEventListener('change', (e) => {
            const interval = parseInt(e.target.value);
            if (autoRefreshInterval) clearInterval(autoRefreshInterval);
            
            if (interval > 0) {
                autoRefreshInterval = setInterval(loadAlerts, interval * 1000);
            }
        });

        // Clean up WebSocket on page unload
        window.addEventListener('beforeunload', () => {
            if (ws) {
                ws.close();
            }
        });

        // Initial load and WebSocket connection
        loadAlerts();
        connectWebSocket();
    </script>
</body>
</html>
